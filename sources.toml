# Outside sources. Each table is one git repository that the library keeps
# as a verbatim copy in plugins/<name>/. The table name is the plugin name,
# and thus the prefix of its skills: <name>:<skill>.
#
#   repository  where to fetch from: a URL, or a local clone (no push needed)
#   path        the folder in the repository to copy from
#   commit      the pin: the commit the copy came from. `sources accept` moves it.
#   plugin      true: `path` is a complete plugin, copied as it is.
#               Without it, `path` holds skills, and the engine writes the
#               plugin manifests.
#   skills      the skills to copy. Without it, every skill under `path`.
#   branch      the branch to follow. Without it, the default branch.
#
# The order here is the order of precedence where skills install without a
# prefix. plugins/h00man/ always wins.

[matt]
repository = "https://github.com/mattpocock/skills"
path = "skills"
skills = ["teach", "handoff", "writing-for-agents"]
commit = "4ae2317ddb22b046e26455e4f9c9b3aaaf62212d"

# My port of pstack. The fetch reads the local clone, so a commit there is
# enough. It is a complete plugin: skills, agents, and hooks.
[pstack]
repository = "/Users/h0_0man/Documents/h00man.code/pstack-claude"
path = "plugins/pstack"
plugin = true
commit = "cd675728babc71ecd8dbc969f6722bcb462b3125"

# Damir Sokolovsky's UI unslop skill (CC BY 4.0). Named after the author,
# because h00man and pstack already have a writing skill named unslop.
[heydamir]
repository = "https://github.com/heydamir/unslop"
commit = "a6f121eee5f29c2f74976b75456feae8b66afb3a"

# Theo Browne's tstack: PR shipping skills (full-send, council, babysit-pr).
# Some use T3 Code's delegate_task and fall back to native tools.
[tstack]
repository = "https://github.com/t3dotgg/tstack"
commit = "1085050f3baed1ac724caa4a8166145fb2ac88af"

# Benji Taylor's stageshow (MIT): faux product UI and animated demos,
# with a React kit, examples, and film scripts. Named after the author.
[benji]
repository = "https://github.com/benjitaylor/skills"
skills = ["stageshow"]
commit = "802057409787133703c56001080169e347305572"

